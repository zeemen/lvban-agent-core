services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lvban-pg
    environment:
      POSTGRES_USER: lvban
      POSTGRES_PASSWORD: lvban_dev
      POSTGRES_DB: lvban
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lvban -d lvban"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: lvban-redis
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
